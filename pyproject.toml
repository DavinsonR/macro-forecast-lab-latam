[project]
name = "macro-forecast-lab-latam"
version = "1.1.0"
description = "Laboratorio de modelos de pronostico del crecimiento economico agregado: Colombia y America Latina"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Davirson Novoa Ramirez" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "openpyxl>=3.1",
    "pyarrow>=16",
    "matplotlib>=3.8",
    "torch>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["macro_lab"]

# torch solo CPU en Linux: evita bajar ~2 GB de CUDA en CI. En Windows y macOS el wheel
# de PyPI ya es CPU.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# B023: las funciones anidadas de impresion capturan la fila del bucle a proposito.
ignore = ["B023"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
