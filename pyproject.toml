[project]
name = "macro-forecast-lab-latam"
version = "0.1.0"
description = "Laboratorio de modelos de pronostico del crecimiento economico agregado: Colombia y America Latina"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "openpyxl>=3.1",
    "pyarrow>=16",
    "matplotlib>=3.8",
    "torch>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["macro_lab"]
